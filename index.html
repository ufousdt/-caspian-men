<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFO Kazino</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0a0a0a;
color:white;
}

.header{
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
background:#111;
border-bottom:1px solid #222;
}

.logo{
font-size:40px;
}

.login{
padding:40px 20px;
text-align:center;
}

input{
width:280px;
padding:15px;
border:none;
border-radius:10px;
margin-top:15px;
font-size:18px;
}

button{
margin-top:15px;
padding:15px 35px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:bold;
cursor:pointer;
}

.panel{
display:none;
padding:20px;
}

.balance{
background:#151515;
padding:20px;
border-radius:15px;
margin-bottom:20px;
font-size:24px;
text-align:center;
}

.games{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.game{
background:#151515;
padding:25px;
border-radius:15px;
text-align:center;
font-size:20px;
}

.footer{
margin-top:20px;
padding:15px;
text-align:center;
color:#888;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">🛸 UFO KAZINO</div>
</div>

<div class="login" id="login">
<h2>PIN Kodunu Daxil Et</h2>

<input id="pin" placeholder="PIN">

<br>

<button onclick="enterSite()">DAXİL OL</button>

<p style="margin-top:15px;color:#888;">
Demo PIN: 123456
</p>
</div>

<div class="panel" id="panel">

<div class="balance">
💰 Balans: 1000 AZN
</div>

<div class="games">

<div class="game">🎰 Slot</div>

<div class="game">🎲 Lucky Dice</div>

<div class="game">🃏 Cards</div>

<div class="game">🏆 Jackpot</div>

</div>

<div class="footer">
UFO Kazino Demo
</div>

</div>

<script>
function enterSite(){
const pin=document.getElementById("pin").value;

if(pin==="123456"){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
}else{
alert("PIN yanlışdır");
}
}
</script>

</body>
</html>
