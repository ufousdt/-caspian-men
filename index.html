<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASPIAN MEN</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
padding:20px;
text-align:center;
border-bottom:1px solid #222;
}

header h1{
color:gold;
font-size:32px;
}

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h2{
font-size:42px;
margin-bottom:15px;
}

.hero p{
color:#ccc;
margin-bottom:20px;
}

.btn{
background:gold;
color:black;
padding:12px 25px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.section{
padding:50px 20px;
}

.section h3{
text-align:center;
color:gold;
margin-bottom:25px;
font-size:28px;
}

.cards{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.card{
background:#111;
padding:20px;
border-radius:15px;
text-align:center;
}

footer{
padding:30px;
text-align:center;
border-top:1px solid #222;
color:#aaa;
}
</style>
</head>

<body>

<header>
<h1>CASPIAN MEN</h1>
</header>

<section class="hero">
<h2>Premium Kişi Geyimləri</h2>
<p>Stilinizi bizimlə tamamlayın</p>
<a class="btn" href="https://www.instagram.com/caspian_men_787">Instagram</a>
</section>

<section class="section">
<h3>Kateqoriyalar</h3>

<div class="cards">
<div class="card">👔 Köynəklər</div>
<div class="card">🤵 Kostyumlar</div>
<div class="card">👖 Şalvarlar</div>
<div class="card">👞 Ayaqqabılar</div>
</div>

</section>

<footer>
© CASPIAN MEN
</footer>

</body>
</html>
