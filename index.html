<input type="text" id="search" placeholder="Ad və soyad">
<button onclick="axtar()">Axtar</button>

<div id="result"></div>

<script>
let data = [];

fetch("data.json")
  .then(r => r.json())
  .then(d => data = d);

function axtar() {
  const q = document.getElementById("search").value.toLowerCase();

  const netice = data.filter(x =>
    (x.ad + " " + x.soyad).toLowerCase().includes(q)
  );

  document.getElementById("result").innerHTML =
    netice.map(x =>
      `<p>${x.ad} ${x.soyad}</p>`
    ).join("");
}
</script>
